name: Website

# Builds Haze for WebAssembly, checks it against the native build, and builds the website
# (site/). Pushes to main deploy the site to Cloudflare Pages (https://haze-lang.pages.dev);
# pull requests only build and test it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the WebAssembly engine and the site
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          test: false

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # C for Lean's Init and Std libraries and the compiled runtime; only Haze's own files
      # change between runs
      - uses: actions/cache@v4
        with:
          path: wasm/.cache
          key: wasm-${{ hashFiles('lean-toolchain', 'wasm/build.py', 'wasm/*.c') }}-${{ github.sha }}
          restore-keys: wasm-${{ hashFiles('lean-toolchain', 'wasm/build.py', 'wasm/*.c') }}-

      - name: Build the WebAssembly engine
        run: python3 wasm/build.py --jobs 4

      - name: Check it against the native build
        run: node wasm/test_node.mjs --skip=chip_design,production_test

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm test
          node build.mjs

      # Needs a Cloudflare API token with the "Cloudflare Pages: Edit" permission in the
      # CLOUDFLARE_API_TOKEN secret, and the account ID in CLOUDFLARE_ACCOUNT_ID. Without them the
      # site is only built and tested.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: npx --yes wrangler@4 pages deploy dist --project-name haze-lang --branch main --commit-hash ${{ github.sha }}

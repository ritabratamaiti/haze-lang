name: Release

# Pushing a tag such as v0.1.0 builds Haze on Linux, macOS and Windows and attaches the
# archives to a draft GitHub release, which can be checked and then published by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (it must already exist)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft with the release notes for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # the notes are the section of RELEASES.md for this version
          awk -v v="$version" '
            /^## / { keep = (index($0, "## v" v) == 1); next }
            keep' RELEASES.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --title "Haze $TAG" --notes-file notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-linux, exe: haze, archive: tar.gz }
          - { os: macos-latest, target: aarch64-macos, exe: haze, archive: tar.gz }
          - { os: windows-latest, target: x86_64-windows, exe: haze.exe, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install elan
        if: runner.os != 'Windows'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install elan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile elan-init.ps1
          .\elan-init.ps1 -NoPrompt 1 -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        run: lake build haze

      - name: Smoke test
        run: |
          ./.lake/build/bin/${{ matrix.exe }} --version
          ./.lake/build/bin/${{ matrix.exe }} examples/probability_classics.hz > /dev/null

      - name: Package
        run: |
          name="haze-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp ".lake/build/bin/${{ matrix.exe }}" LICENSE.md README.md "$name/"
          cp -r examples "$name/examples"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

      # Build provenance: a signed statement, recorded by GitHub, that this archive was built by
      # this workflow from this commit. Check it with `gh attestation verify FILE -R OWNER/REPO`.
      # GitHub only offers this for public repositories on the free plan.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  docker:
    name: Docker image
    needs: create
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # GHCR_TOKEN is a classic token with the write:packages scope. GitHub doesn't let the
      # workflow's own token create a package in a personal account, so it is needed at least
      # for the first push (see docs/Releasing.md).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - name: Build and smoke-test the image
        run: |
          docker build -t haze:release .
          docker run --rm haze:release --version
      - name: Push ghcr.io/OWNER/haze-lang:VERSION and :latest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/haze-lang"
          for t in "${TAG#v}" latest; do
            docker tag haze:release "$image:$t"
            docker push "$image:$t"
          done

  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Write SHA256SUMS for the release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "haze-*" -D assets
          (cd assets && sha256sum haze-* > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber

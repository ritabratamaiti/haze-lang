name: Distribution

# Tests the ways Haze is distributed: building from source with the install script, the
# GitHub Action, and the Docker image.

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - action.yml
      - Dockerfile
      - .devcontainer/**
      - binder/**
      - notebooks/**
      - .github/workflows/distribution.yml
  workflow_dispatch:

permissions:
  # reading a draft release needs write access
  contents: write

jobs:
  source-install:
    name: Install from source (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install with install.sh, building from this checkout
        run: HAZE_SOURCE_DIR="$PWD" HAZE_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
      - name: Run the installed haze
        run: |
          "$RUNNER_TEMP/bin/haze" --version
          "$RUNNER_TEMP/bin/haze" examples/Gallery/games.hz | grep "244/495"

  action:
    name: GitHub Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - id: haze
        uses: ./
        with:
          version: v0.1.0
          files: examples/Gallery/games.hz examples/Gallery/gen*.hz
      - name: haze is on the PATH
        shell: bash
        run: |
          haze --version
          test "${{ steps.haze.outputs.version }}" = v0.1.0

  notebook:
    name: Notebook (as Binder sets it up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run binder/postBuild with the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0 -R "$GITHUB_REPOSITORY" -p "haze-v0.1.0-x86_64-linux.tar.gz" -D "$RUNNER_TEMP"
          HAZE_ARCHIVE="$RUNNER_TEMP/haze-v0.1.0-x86_64-linux.tar.gz" sh binder/postBuild
      - name: Execute the notebook
        run: |
          pip install --quiet nbclient nbformat ipykernel
          python - <<'EOF'
          import nbformat, nbclient
          nb = nbformat.read("notebooks/try_haze.ipynb", as_version=4)
          nbclient.NotebookClient(nb, timeout=600, kernel_name="python3").execute()
          text = "".join(o.get("text", "") for c in nb.cells if c.cell_type == "code" for o in c.outputs)
          for expected in ["is ready", "=1/6", "theorem rejected", "=244/495", "bound holds"]:
              assert expected in text, f"missing from the notebook's output: {expected}"
          print(text)
          EOF

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t haze:test .
      - name: Run
        run: |
          docker run --rm haze:test --version
          docker run --rm -v "$PWD/examples:/work" haze:test Gallery/games.hz | grep "244/495"

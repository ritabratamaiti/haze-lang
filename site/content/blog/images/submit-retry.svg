<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-labelledby="title desc">
  <title id="title">Chance of exactly one saved copy after a lost response</title>
  <desc id="desc">The chance of success is p before the write and one minus p after the write. At a retry probability of one half, both success probabilities equal one half.</desc>
  <style>
    svg { --bg:#fff; --ink:#23313b; --guide:#bdc7cc; --up:#1f5980; --down:#8e431d }
    @media (prefers-color-scheme:dark) { svg { --bg:#0b1120; --ink:#e0e7eb; --guide:#52606b; --up:#97c9e8; --down:#ffbc9b } }
    text { font:18px system-ui,sans-serif; fill:var(--ink) }
    .up { fill:var(--up) } .down { fill:var(--down) }
  </style>
  <rect width="660" height="300" fill="var(--bg)"/>
  <text x="64" y="27">Chance of exactly one save</text>
  <path d="M66 49V239H454 M66 144H454 M260 49V239" fill="none" stroke="var(--guide)" stroke-width="1"/>
  <g text-anchor="end"><text x="56" y="56">100%</text><text x="56" y="150">50%</text><text x="56" y="244">0%</text></g>
  <g text-anchor="middle"><text x="66" y="266">0%</text><text x="260" y="266">50%</text><text x="454" y="266">100%</text><text x="260" y="292">Chance of retrying</text></g>
  <path d="M66 239L454 49" stroke="var(--up)" stroke-width="3" fill="none"/>
  <path d="M66 49L454 239" stroke="var(--down)" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <circle cx="260" cy="144" r="5" fill="var(--ink)"/>
  <text x="465" y="55" class="up">First write lost</text>
  <text x="465" y="244" class="down">First write saved</text>
</svg>
